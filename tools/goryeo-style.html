<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고려편 시범 시안</title>
<link rel="stylesheet" href="../styles.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  #ui > * { pointer-events: auto; }
  #tabs { position: fixed; z-index: 90; left: 8px; top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #tabs a { font: 700 13px var(--font-ui); color: var(--hanji); background: rgba(27,31,29,.85); border: 1px solid #3b2f22; border-radius: 6px; padding: 4px 9px; text-decoration: none; }
  #tabs a.on { background: var(--dan-red); border-color: var(--gold); }
  #bar { position: fixed; z-index: 90; left: 6px; bottom: 6px; font: 12px var(--font-ui); color: #fff; background: #0008; padding: 2px 8px; border-radius: 4px; }
  .tag { position: fixed; z-index: 20; transform: translate(-50%, 0); font: 700 12px var(--font-ui); color: var(--hanji); background: rgba(27,31,29,.82);
    border: 1px solid var(--gold); border-radius: 5px; padding: 1px 6px; white-space: nowrap; pointer-events: none; text-align: center; }
  .tag.old { border-color: #8a847a; color: #cfc9bd; }
  #title { position: fixed; z-index: 90; right: 10px; top: 8px; font: 700 15px var(--font-display); color: var(--hanji); background: rgba(27,31,29,.85); border: 1px solid var(--gold); border-radius: 6px; padding: 4px 10px; }
</style>
<script>
  window.__errors = [];
  addEventListener('error', e => window.__errors.push(String(e.message || e)));
  addEventListener('unhandledrejection', e => window.__errors.push(String(e.reason && e.reason.message || e.reason)));
</script>
</head>
<body>
<div id="stage"></div>
<div id="ui"></div>
<div id="tabs"></div>
<div id="title"></div>
<div id="bar"></div>
<script type="module">
  // 선생님 확인용 시안 갤러리(2026-10-26, 2판: 지금 게임 그래픽을 바탕으로).
  // ?view=compare(지금/새 사람 나란히)|people|guardian|actions|castle(지금 2장 탐험과 같은 각도, &side=out 성 밖)|play(&stamp=1 도장), &cam=x,y,z,tx,ty,tz
  import * as THREE from 'three';
  import { createWorld, MOODS } from '../core/world.js';
  import { makePerson } from '../core/people.js';
  import { LOOKS } from '../content/characters.js';
  import { FIGURE_LOOKS, GUARDIAN_LOOKS, GUARDIAN_OUTFITS, guardianLook, crowdLook, makeFigure, setAction, animateFigure, drawPieces } from '../core/figures.js';
  import { SNOW_MOOD, buildHeunghwaSet } from '../chapters/goryeo/set.js';
  import { createGauge, createCardHand, stampSeal } from '../core/hud-ops.js';

  const q = new URLSearchParams(location.search);
  const view = q.get('view') || 'compare';
  const VIEWS = { compare: '지금/새 사람', people: '직업 사람', guardian: '지킴이·군중', actions: '동작', castle: '성(2장 각도)', play: '놀이 화면' };
  const extra = [['castle&side=out', '성 밖', 'side'], ['play&stamp=1', '도장 쾅', 'stamp']];
  document.getElementById('tabs').innerHTML = Object.entries(VIEWS).map(([k, v]) => `<a href="?view=${k}" class="${k === view && !q.get('side') && !q.get('stamp') ? 'on' : ''}">${v}</a>`).join('')
    + extra.map(([h, v, k]) => `<a href="?view=${h}" class="${q.get(k) ? 'on' : ''}">${v}</a>`).join('');
  document.getElementById('title').textContent = `고려편 시범 시안 · ${VIEWS[view]}`;

  MOODS.goryeoSnow = SNOW_MOOD; // 갤러리에서만 쓰는 이름(지금 'snow'를 조금 밝힌 것). world.js는 그대로
  const world = createWorld(document.getElementById('stage'), { quality: q.get('q') || 'medium' });
  world.setMood('goryeoSnow');
  world.player.visible = false;
  world.resize(); addEventListener('resize', () => world.resize());
  const L = world.level, figs = [], tags = [];
  const set = buildHeunghwaSet(world);
  const H = set.wallHeight, HALF = set.half;
  const tag = (obj, html, dy = -0.3, cls = '') => { const d = document.createElement('div'); d.className = `tag ${cls}`; d.innerHTML = html; document.body.appendChild(d); tags.push({ d, obj, dy }); };
  const add = (look, x, z, ry = 0, action = 'idle', label = null, y = 0) => {
    const f = makeFigure(look); f.position.set(x, y, z); f.rotation.y = ry; setAction(f, action); L.add(f); figs.push(f);
    if (label) tag(f, label);
    return f;
  };
  const addOld = (look, x, z, label) => { const p = makePerson(look, { track: false }); p.position.set(x, 0, z); L.add(p); if (label) tag(p, label, -0.3, 'old'); return p; };
  // 성 남쪽(성문·옹성 앞) 눈밭에 줄 세운다: 뒤로 성벽과 문루가 보인다
  const Z = 24;

  if (view === 'compare') {
    const pairs = [[LOOKS.soldier, 'soldier', '병사'], [LOOKS.archer, 'archer', '궁수'], [LOOKS.officer, 'official', '관리'], [LOOKS.monk, 'monk', '승려'], [LOOKS.villager, 'commoner', '백성'], [LOOKS.khitan, 'khitan', '거란 병사']];
    pairs.forEach(([o, j, n], i) => { const x = -9.4 + i * 3.75; addOld(o, x - 0.8, Z, `지금<br>${n}`); add(FIGURE_LOOKS[j], x + 0.8, Z, 0, 'idle', `새<br>${n}`); });
    world.setFixedCamera([0, 4.2, Z + 12.5], [0, 1.6, Z]);
  } else if (view === 'people') {
    const jobs = ['soldier', 'archer', 'official', 'monk', 'artisan', 'commoner', 'commonerWoman', 'khitan'];
    jobs.forEach((j, i) => add(FIGURE_LOOKS[j], -8.75 + i * 2.5, Z, 0, 'idle', FIGURE_LOOKS[j].name));
    world.setFixedCamera([0, 4.2, Z + 13], [0, 1.6, Z]);
  } else if (view === 'guardian') {
    const outfits = Object.keys(GUARDIAN_OUTFITS);
    Object.keys(GUARDIAN_LOOKS).forEach((id, gi) => outfits.forEach((o, oi) => {
      const f = add(guardianLook(id, o), -7.4 + gi * 6.2 + (oi - 1) * 1.9, Z + 2.5, oi === 2 ? -0.9 : 0, 'idle', ['병사', '궁수', '일꾼'][oi]);
      if (oi === 1) tag(f, `<b>${GUARDIAN_LOOKS[id].name}</b>`, -0.95);
    }));
    const crowd = [['commoner', 1], ['commoner', 2], ['commonerWoman', 1], ['commoner', 3], ['commonerWoman', 2], ['commoner', 4], ['soldier', 2], ['official', 3], ['monk', 2], ['artisan', 2]];
    crowd.forEach(([j, s], i) => add(crowdLook(j, s), -11.3 + i * 2.5, Z - 3, 0, 'idle'));
    tag({ position: new THREE.Vector3(0, 0, Z - 3) }, '뒷줄: 군중 변화(키·옷색·모자·든 것)', 3.6);
    world.setFixedCamera([0, 5.2, Z + 15], [0, 1.3, Z]);
  } else if (view === 'actions') {
    const acts = [
      [guardianLook('a', 'soldier'), 'walk', '걷기'], [guardianLook('b', 'worker'), 'cheer', '기뻐함'], [FIGURE_LOOKS.official, 'surprise', '놀람'],
      [FIGURE_LOOKS.soldier, 'push', '밀기'], [FIGURE_LOOKS.archer, 'shoot', '활쏘기'], [guardianLook('c', 'worker'), 'carry', '옮기기'], [FIGURE_LOOKS.monk, 'nod', '끄덕임'],
    ];
    acts.forEach(([l, a, n], i) => add(l, -8.4 + i * 2.8, Z, a === 'shoot' ? -0.9 : a === 'push' ? -0.6 : 0, a, n));
    world.setFixedCamera([0, 4.4, Z + 12.5], [0, 1.6, Z]);
  } else if (view === 'castle') {
    // 성안 사람들(2장 자리 근처)과 성벽 위 병사
    add(FIGURE_LOOKS.soldier, 5, 4.5, Math.PI * 0.8); add(LOOKS.yanggyu ? { ...LOOKS.yanggyu, job: 'soldier', add: ['armor'] } : FIGURE_LOOKS.soldier, -3, -7, 0);
    add(crowdLook('commoner', 2), -8, 5.5, Math.PI * 0.6); add(crowdLook('commonerWoman', 1), -3.5, 4.2, 0.4); add(crowdLook('artisan', 1), 2.4, 4.6, -0.6, 'carry');
    [-9, -3, 4, 10].forEach((x, i) => add(crowdLook('soldier', i + 1), x, -HALF - 0.6, Math.PI, 'idle', null, H + 0.14));
    add(FIGURE_LOOKS.archer, -0.5, -HALF - 0.5, Math.PI, 'shoot', null, H + 0.14);
    if (q.get('side') === 'out') {
      [[-6, -18], [2, -19], [-14, -17.5], [-20, -10], [-21, 4], [-17, -22], [-24, -4]].forEach(([x, z], i) => add(crowdLook('khitan', i + 1), x, z, 0, i < 3 ? 'push' : 'walk'));
      world.setFixedCamera([-36, 17, -26], [-6, 2, -3]);
    } else world.setFixedCamera([0, 8.5, 18], [0, 1, 2]); // 지금 2장 탐험 시작과 같은 각도(플레이어 (0,6) 뒤따라가기)
  } else {
    // 놀이 화면: 북쪽 성벽 한 구간을 성 밖 비스듬히 위에서. 성벽 위 병사·지킴이, 사다리로 오르는 거란 병사, 아래 거란 무리
    const zoneMat = c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.85, depthWrite: false });
    [[-6, '오른쪽'], [2, '가운데'], [9, '왼쪽']].forEach(([x, n], i) => {
      const r = new THREE.Mesh(new THREE.RingGeometry(1.15, 1.35, 28), zoneMat(i === 1 ? 0xd9a441 : 0xf2ead9)); r.rotation.x = -Math.PI / 2; r.position.set(x, H + 0.24, -HALF - 0.6); L.add(r);
      tag(r, `${n} 구역`, 0.05);
    });
    add(FIGURE_LOOKS.soldier, 2, -HALF - 0.9, Math.PI, 'push', null, H + 0.14);
    add(crowdLook('soldier', 2), 3.4, -HALF - 0.4, Math.PI * 0.9, 'idle', null, H + 0.14);
    add(FIGURE_LOOKS.archer, 9.6, -HALF - 0.6, Math.PI * 0.85, 'shoot', null, H + 0.14);
    add(crowdLook('soldier', 3), -6, -HALF - 0.7, Math.PI * 1.05, 'surprise', null, H + 0.14);
    const me = add(guardianLook('b', 'soldier'), -1.2, -HALF - 0.4, Math.PI * 0.85, 'cheer', null, H + 0.14);
    tag(me, '나(지킴이)', -0.4);
    const climb = (x, y) => add(crowdLook('khitan', 1), x, -HALF - 1.7 - 6.4 * Math.sin(0.32) + y * Math.tan(0.32) - 0.45, 0, 'push', null, y);
    climb(2, 2.4); climb(9, 1.3); climb(-6, 0.6);
    [[-3, -21], [5, -22], [12, -20.5], [-9, -23], [0, -26], [8, -27], [15, -25], [-5, -28]].forEach(([x, z], i) => add(crowdLook('khitan', i + 1), x, z, 0, i % 3 === 0 ? 'surprise' : 'walk'));
    world.setFixedCamera([6.5, 10.2, -25.5], [1.6, 3.9, -13.2]);
    const ui = document.getElementById('ui');
    const gauge = createGauge(ui, { value: 0.42 });
    setTimeout(() => gauge.set(0.62), 400);
    if (!q.get('stamp')) createCardHand(ui, [
      { id: 'move', title: '병사 옮기기', text: '사다리 쪽으로 보내요', icon: 'soldier' },
      { id: 'push', title: '사다리 밀기', text: '두 명이면 큰 사다리도', icon: 'push' },
      { id: 'stone', title: '돌 굴리기', text: '아래 무리를 물러나게', icon: 'stone' },
      { id: 'flag', title: '깃발 올리기', text: '고려 기세가 올라요', icon: 'flag' },
    ], { onPick: () => {} }).cards[1].classList.add('picked');
    else setTimeout(() => stampSeal(ui, { text: '지킴', sub: '흥화진을 지켰다!', keep: true }), 300);
  }
  if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); world.setFixedCamera(c.slice(0, 3), c.slice(3)); }

  const one = drawPieces(makeFigure(FIGURE_LOOKS.soldier)), oldOne = drawPieces(makePerson(LOOKS.soldier, { track: false }));
  const v = new THREE.Vector3();
  function placeTags() {
    const w = innerWidth, h = innerHeight;
    for (const t of tags) {
      if (t.obj.isObject3D) t.obj.getWorldPosition(v); else v.copy(t.obj.position);
      v.y += t.dy; v.project(world.camera);
      t.d.style.left = `${(v.x + 1) / 2 * w}px`; t.d.style.top = `${(1 - v.y) / 2 * h}px`;
      t.d.style.display = v.z < 1 ? '' : 'none';
    }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    world.step(dt, { x: 0, z: 0 }); // 세트의 깃발·연기·눈은 world.onUpdate로 움직인다
    for (const f of figs) animateFigure(f, dt);
    world.render(); placeTags();
    requestAnimationFrame(frame);
  }
  for (let i = 0; i < 30; i++) { for (const f of figs) animateFigure(f, 0.033); world.step(0.033, { x: 0, z: 0 }); }
  world.renderer.info.autoReset = false; world.renderer.info.reset(); world.render();
  window.__calls = world.renderer.info.render.calls;
  world.renderer.info.autoReset = true;
  document.getElementById('bar').textContent = `그리기 ${window.__calls}회(그림자 포함) · 사람 하나 조각: 새 ${one} / 지금 ${oldOne} · 사람 ${figs.length}명`;
  placeTags();
  window.__world = world; window.__figs = figs;
  requestAnimationFrame(frame);
  window.__ready = true;
</script>
</body>
</html>
