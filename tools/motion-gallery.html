<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>motion gallery</title>
<link rel="stylesheet" href="../styles.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<style>#bar { position: fixed; z-index: 99; left: 4px; top: 4px; font: 14px sans-serif; color: #fff; background: #0009; padding: 3px 8px; }</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<script type="module">
  // 개발용: 인물 움직임(2026-10-30 움직임 개선)을 한 마당에서 본다. ?act=walk|turn|weapons|carry|handshake|give|escort|strike|talk|chain|horse|rider|row|gait|lineup
  // window.__t(초)·window.__phase(지금 하는 일)를 보고 사진을 찍는다(scratchpad motion.cjs)
  import * as THREE from 'three';
  import { createWorld } from '../core/world.js';
  import { buildArena } from '../chapters/kit/play.js';
  import { makePerson, setCarry, setStyle, setTalking } from '../core/people.js';
  import { walkTo, turnTo, handshake, giveItem, escort, strike, block, pickUp, putDown } from '../core/interact.js';
  import { LOOKS } from '../content/characters.js';
  import { makeHorse, mount } from '../core/horse.js';
  import { setHairEra } from '../core/hairstyle.js';
  import { addSculler, autoRow } from '../chapters/kit/row.js';
  import { rider as armyRider } from '../chapters/kit/army.js';
  import * as BLD from '../chapters/kit/buildings.js';
  setHairEra(new URLSearchParams(location.search).get('era'), new URLSearchParams(location.search).get('ch') || '');
  const q = new URLSearchParams(location.search), act = q.get('act') || 'walk';
  const world = createWorld(document.getElementById('stage'), { quality: 'medium' });
  window.__world = world; // 점검 도구(tools/qa)가 장면을 읽는다
  world.setMood('morning'); world.player.visible = false;
  const arena = buildArena(world, { origin: [0, 0], ground: 'earth', groundColor: 0x9a8a68, hill: 0.5, bounds: { x0: -14, x1: 14, z0: -10, z1: 10 }, nature: false });
  const g = arena.group;
  const P = (look, x, z, ry = 0) => { const p = makePerson(typeof look === 'string' ? LOOKS[look] : look); p.position.set(x, 0, z); p.rotation.y = ry; g.add(p); return p; };
  const box = (w = 0.6, h = 0.35, d = 0.45, c = 0x8a6a48) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c })); m.castShadow = true; return m; };
  const bar = document.getElementById('bar'), phase = t => { window.__phase = t; bar.textContent = `${act}: ${t}`; };
  const cam = (pos, look) => world.setFixedCamera(pos, look);
  window.__hooks = {};
  let last = performance.now(); window.__t = 0;
  let follow = null; const track = (p, off = [0, 1.4, 5.5]) => { follow = { p, off }; }; // 걷는 사람을 옆에서 따라가며 본다
  // &fixed=1: 한 프레임에 1/30초씩(실제 시간과 상관없이 늘 같은 장면) · &pauseAt=2,5.5: 그 시각에 멈춰 window.__hold에 시각을 둔다(점검 도구가 사진을 찍고 null로 풀면 이어 간다)
  const fixed = q.get('fixed'), stops = (q.get('pauseAt') || '').split(',').filter(Boolean).map(Number).sort((a, b) => a - b); window.__hold = null;
  const loop = now => { let dt = fixed ? 1 / 30 : Math.min(0.05, (now - last) / 1000); last = now; if (window.__hold != null) dt = 0; else if (stops.length && window.__t >= stops[0]) { window.__hold = stops.shift(); dt = 0; } window.__t += dt; world.step(dt, { x: 0, z: 0 }); if (follow) { const v = follow.p.getWorldPosition(new THREE.Vector3()); world.setFixedCamera([v.x + follow.off[0], follow.off[1] + 0.6, v.z + follow.off[2]], [v.x, 1.3, v.z]); } world.render(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const sleep = s => new Promise(r => { const end = window.__t + s; const off = world.onUpdate(() => { if (window.__t >= end) { off(); r(); } }); }); // 장면 시계로 기다린다(멈춘 동안은 기다림도 멈춘다)
  const scenes = {
    async lineup() { // 생김새 줄 세우기(옷차림 확인): &ids=sejong,scholar,…&era=joseon
      const ids = (q.get('ids') || 'sejong,joseonOfficial,scholar,joseonSoldier,commoner,woman').split(',');
      const n = ids.length, gap = 1.5;
      ids.forEach((id, i) => P(id, (i - (n - 1) / 2) * gap, 0, 0.25 * Math.sin(i)));
      cam([0, 1.8, n * 0.62 + 2.2], [0, 1.25, 0]); phase('끝');
    },
    async gait() { // 한 사람의 걸음 한 바퀴를 가까이(옆에서 따라가며). &v=빠르기 &look=생김새 &style=captive|guard|weary &carry=arms|shoulder|back
      const look = q.get('look') || 'villager', a = P(look, -12, 0, Math.PI / 2);
      if (q.get('style')) setStyle(a, q.get('style'));
      if (q.get('carry')) setCarry(a, box(0.6, 0.4, 0.5), q.get('carry'));
      track(a, [0.6, 1.0, 4.2]);
      phase(`v ${q.get('v') || 1.6}`); await walkTo(world, a, [13, 0], { speed: +(q.get('v') || 1.6) }); phase('끝');
    },
    async walk() { // 걷기 → 빠른 걸음 → 달리기 → 멈춤(가속·감속), 옆에서 본다
      cam([0, 2.4, 11], [0, 1.2, 0]);
      const a = P('villager', -12, 0, Math.PI / 2), b = P('soldier', -12, -3, Math.PI / 2), c = P({ ...LOOKS.villager, face: { ...LOOKS.villager.face, age: 'old' } }, -12, 3, Math.PI / 2);
      track(a, [0, 1.4, 6.5]);
      phase('걷기'); await Promise.all([walkTo(world, a, [-4, 0], { speed: 1.5 }), walkTo(world, b, [-4, -3], { speed: 1.5 }), walkTo(world, c, [-6, 3], { speed: 1.1 })]);
      phase('빠른 걸음'); await Promise.all([walkTo(world, a, [3, 0], { speed: 2.8 }), walkTo(world, b, [3, -3], { speed: 2.8 })]);
      phase('달리기'); await Promise.all([walkTo(world, a, [12, 0], { speed: 5.5, accel: 0.6 }), walkTo(world, b, [12, -3], { speed: 5.5, accel: 0.6 })]);
      phase('멈춤'); await sleep(1.5); phase('끝');
    },
    async turn() { // 방향 바꾸며 걷기와 제자리 돌기, 도착해서 방향 맞추기
      cam([0, 6, 12], [0, 0.8, 0]);
      const a = P('commoner', -8, 4, Math.PI / 2);
      phase('ㄱ자로 걷기'); await walkTo(world, a, [0, 4], { speed: 1.6 }); await walkTo(world, a, [0, -4], { speed: 1.6 }); await walkTo(world, a, [6, -4], { speed: 1.6, face: { x: 6, z: 10 } });
      phase('돌아서기'); await turnTo(world, a, { x: -6, z: -4 }); await sleep(0.8); phase('끝');
    },
    async weapons() { // 창·칼·활·총을 든 사람이 함께 걷다가 선다
      cam([0, 2.6, 9], [0, 1.4, 0]);
      const ppl = ['soldier', 'yanggyu', 'archer', 'independenceArmy'].map((l, i) => P(l, -11, -3 + i * 2, Math.PI / 2));
      phase('무기 들고 걷기'); await Promise.all(ppl.map((p, i) => walkTo(world, p, [0, -3 + i * 2], { speed: 1.6 })));
      phase('멈춰 서기'); await sleep(1.6); phase('끝');
    },
    async carry() { // 짐 집기 → 무거운 짐을 안고 걷기 → 내려놓기, 어깨에 메고 걷기
      cam([0, 2.8, 9], [0, 1.1, 0]);
      const a = P('worker', -6, 0, Math.PI / 2), crate = box(0.7, 0.45, 0.5); crate.position.set(-4.4, 0.23, 0); g.add(crate);
      const b = P('villager', -9, -3, Math.PI / 2), hide = box(0.4, 0.3, 0.9, 0x6b4a32); setCarry(b, hide, 'shoulder');
      const spot = box(1, 0.05, 1, 0x5a4a3a); spot.position.set(4, 0.03, 0); g.add(spot);
      phase('집기'); await pickUp(world, a, crate, { from: [-5.2, 0] });
      phase('안고 걷기'); const wb = walkTo(world, b, [6, -3], { speed: 1.5 }); await walkTo(world, a, [3.2, 0], { speed: 1.4, face: { x: 4, z: 0 } });
      phase('내려놓기'); await putDown(world, a, spot); await wb; await sleep(1); phase('끝');
    },
    async handshake() {
      cam([1.6, 2.4, 5.2], [0, 1.6, 0]);
      const a = P('seojaepil', -1.6, 0.4, Math.PI / 2), b = P('gentleman', 2.6, -0.8, -Math.PI / 2);
      phase('악수'); window.__hooks.handshake = await handshake(world, a, b); await sleep(1); phase('끝');
    },
    async give() {
      cam([0.2, 2.4, 5], [0, 1.4, 0]);
      const a = P('commoner', -1.2, 0, Math.PI / 2), b = P('woman', 1.2, 0, -Math.PI / 2), parcel = box(0.5, 0.25, 0.4, 0xc8b8a0);
      setCarry(a, parcel, 'arms');
      await sleep(0.6); phase('건네기'); window.__hooks.give = await giveItem(world, a, b, parcel); await sleep(0.8);
      phase('받아 들고 걷기'); await walkTo(world, b, [5, 2], { speed: 1.4 }); phase('끝');
    },
    async escort() { // 포로 호송: 앞뒤로 호송병, 가운데 포로
      cam([0, 4, 12], [0, 1, 0]);
      const caps = [P('villager', -10, 0.6, Math.PI / 2), P('villager', -10.8, -0.5, Math.PI / 2), P('kid', -11.6, 0.5, Math.PI / 2)];
      const gs = [P('khitan', -8.6, -0.8, Math.PI / 2), P('khitanBright', -13, 0, Math.PI / 2)];
      phase('호송'); window.__hooks.escort = await escort(world, { captives: caps, guards: gs, path: [[-2, 0], [2, -4], [8, -4]], speed: 1.1 }); await sleep(1); phase('끝');
    },
    async strike() { // 창 찌르기 · 막기 · 밀기
      cam([0, 2.4, 7], [0, 1.4, 0]);
      const a = P('soldier', -1.4, 0, Math.PI / 2), b = P('khitan', 1.4, 0, -Math.PI / 2), c = P('villager', 3.8, -2, -Math.PI / 2);
      for (let n = 0; n < 2; n++) { phase('찌르기·막기'); await Promise.all([strike(a, 'spear'), (async () => { await sleep(0.2); await block(b); })()]); await sleep(0.4); }
      phase('밀기'); await strike(c, 'push'); await sleep(0.8); phase('끝');
    },
    async talk() { // 대화: 말하는 사람의 손짓·끄덕임, 듣는 사람의 끄덕임(표정마다 다른 손짓)
      cam([0, 2.4, 5.5], [0, 1.6, 0]);
      const a = P('yanggyu', -1.2, 0, Math.PI / 2), b = P('villager', 1.2, 0, -Math.PI / 2);
      for (const e of ['talk', 'worry', 'anger', 'joy', 'tension', 'surprise']) { phase(`대화 ${e}`); setTalking(a, e); setTalking(b, 'talk', 'listen'); await sleep(1.6); }
      setTalking(a, null); setTalking(b, null); phase('대화 끝'); await sleep(1); phase('끝');
    },
    async chain() { // 이어서 하기: 걷다가 → 집고 → 걸어가 → 건네고 → 악수 → 돌아서 걸어감
      cam([0, 5, 12], [0, 1, 0]);
      const a = P('commoner', -10, 2, Math.PI / 2), b = P('scholar', 6, 0, -Math.PI / 2), item = box(0.5, 0.25, 0.4, 0xc8b8a0); item.position.set(-5, 0.13, 2); g.add(item);
      phase('걸어가 집기'); await pickUp(world, a, item, { from: [-5.7, 2] });
      phase('걸어가기'); await walkTo(world, a, [3.4, 0.4], { speed: 1.6 });
      phase('건네기'); await giveItem(world, a, b, item, { style: 'side' });
      phase('악수'); await handshake(world, a, b);
      phase('돌아서 걸어감'); await walkTo(world, a, [-8, 5], { speed: 1.8 }); phase('끝');
    },
    async horse() { // 말: 서 있기 → 평보 → 속보 → 구보 → 서기, 기수가 함께 흔들린다. &close=1이면 한 마리를 옆에서 가까이
      const close = q.get('close');
      const hs = (close ? [['mongol', 0]] : [['mongol', 0], ['yanggyu', 3], ['mongol', -3]]).map(([lk, z], i) => { const h = makeHorse({ armor: i === 1 ? 0x6a5a40 : null }); h.position.set(-12, 0, z); h.rotation.y = Math.PI / 2; g.add(h); mount(h, makePerson(LOOKS[lk])); return h; });
      window.__hooks.horse = hs[0];
      if (close) track(hs[0], q.get('front') === '2' ? [5, 1.7, 0.01] : q.get('front') ? [4.5, 1.8, 4.5] : [0.4, 1.6, 6.5]); else cam([0, 4, 16], [0, 1.2, 0]);
      const ride = (h, x, sp) => walkTo(world, h, [x, h.position.z], { speed: sp, accel: 0.5 });
      phase('서 있기'); await sleep(1.2);
      phase('평보'); await Promise.all(hs.map(h => ride(h, -6, 1.5)));
      phase('속보'); await Promise.all(hs.map(h => ride(h, 2, 3.4)));
      phase('구보'); await Promise.all(hs.map(h => ride(h, 13, 6)));
      phase('서기'); await sleep(2); phase('끝');
    },
    async rider() { // 기마병(장면이 쓰는 chapters/kit/army.js의 rider): 서 있기 → 걷기 → 멈춤 → 돌아서기 → 달리기 → 멈춤. 무기 든 기수도 함께
      const hs = [['mongol', 0], ['khitan', -3], ['soldier', -6]].map(([lk, z]) => armyRider(g, lk, -10, z, Math.PI / 2));
      track(hs[1], [7, 4.5, 10]); // 셋이 겹치지 않게 앞쪽 비스듬히에서 따라간다
      const go = (x, sp) => Promise.all(hs.map(h => walkTo(world, h, [x, h.position.z], { speed: sp, accel: 0.6 })));
      phase('서 있기'); await sleep(1.2);
      phase('걷기'); await go(-3, 1.5);
      phase('멈춤'); await sleep(1.5);
      phase('돌아서기'); await Promise.all(hs.map(h => turnTo(world, h, { x: -20, z: h.position.z }))); await sleep(0.6); await Promise.all(hs.map(h => turnTo(world, h, { x: 20, z: h.position.z })));
      phase('달리기'); await go(11, 6);
      phase('멈춤'); await sleep(2); phase('끝');
    },
    async row() { // 노 젓기(장면이 쓰는 chapters/kit/row.js): 배가 서 있다가 나아가고 다시 선다. 사공의 두 손이 노 손잡이를 쥔다
      const water = new THREE.Mesh(new THREE.PlaneGeometry(60, 30).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x3f7fa0 })); water.position.y = 0.03; g.add(water);
      const boats = [-2.5, 2.5].map((x, i) => { const b = new THREE.Group(); b.position.set(x, 0, -9); g.add(b); BLD.boat(b, { len: 4.6 }); const rig = addSculler(b, { look: i ? 'mongol' : 'sambyeolcho', deckY: 0.33, sternZ: -2.0, side: 0.3, scale: 0.85 }); return { b, rig }; });
      const off = autoRow(world, boats.map(x => x.rig)); window.__hooks.row = boats.map(x => x.rig);
      track(boats[0].b, [-8, 3, 4]);
      let sp = 0; const drift = world.onUpdate(dt => boats.forEach(({ b }) => { b.position.z += sp * dt; }));
      phase('서 있기'); await sleep(1.5);
      phase('젓기'); sp = 1.4; await sleep(4.5);
      phase('빠르게'); sp = 2.6; await sleep(3);
      phase('멈춤'); sp = 0; await sleep(2.5); drift(); off(); phase('끝');
    },
  };
  await scenes[act]();
</script>
</body>
</html>
