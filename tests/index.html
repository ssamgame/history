<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>tests</title>
<link rel="stylesheet" href="../styles.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<pre id="out" style="position:relative;z-index:100;background:#fff;color:#000">RUNNING</pre>
<div id="ui"></div>
<div id="sandbox" style="position:fixed;left:0;top:0;width:800px;height:500px;visibility:hidden"></div>
<script type="module">
  import { run } from './harness.js';
  const files = ['smoke', 'save', 'content', 'dialogue', 'input', 'quality', 'world', 'flow', 'screens', 'ch1', 'sw', 'weather', 'minigame', 'ch2', 'ch3', 'faces', 'session2-core', 'ch4', 'ch5', 'ch6', 'classroom', 'speech', 'music', 'graphics', 'courses', 'joseon-core', 'j1', 'j2', 'j3', 'j4', 'j5', 'j6', 'layout', 'kit', 'play', 'feedback', 'goryeo-feedback', 'notebook', 'perf', 'quest', 'stage3-text', 'stage3-gfx', 'goryeo-style', 'ch2-pilot', 'ch1-rally', 'ch3-damflow', 'ch7'];
  const failed = [];
  for (const f of files) {
    try { await import(`./${f}.test.js`); } catch (e) { failed.push(`FAIL import ${f}: ${e.message}`); }
  }
  const r = await run();
  if (failed.length) {
    const out = document.getElementById('out');
    out.textContent = failed.join('\n') + '\n' + out.textContent.replace(/fail=(\d+)/, (_, n) => `fail=${+n + failed.length}`);
  }
</script>
</html>
