<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
<div id="ui"></div>
<script type="module">
  // 화면 맞춤 검사용: 쿼리에 따라 글자 새기기 판이나 카드 순서 맞추기 화면을 띄운다
  import { traceGlyph, orderCards, chooseCards, placeOnBoard, sortCards, timingBar } from '../core/minigame.js';
  import { GLYPHS } from '../content/glyphs.js';
  const ui = document.getElementById('ui');
  const kind = new URLSearchParams(location.search).get('kind');
  // 조선편 미니게임 화면들 (2026-10-23 화면 배치 점검)
  const J = async n => [(await import(`../chapters/joseon/${n}/chapter.js`)), (await import(`../chapters/joseon/${n}/script.js`)).default];
  if (kind === 'trace') traceGlyph({ ui }, GLYPHS[1]);
  else if (kind === 'j1cards') { const [, s] = await J('j1'); chooseCards({ ui }, { title: s.reasons.title, cards: s.reasons.cards }); }
  else if (kind === 'j1board') { const [c, s] = await J('j1'); placeOnBoard({ ui }, { title: s.hanyang.title, ...c.HANYANG, boardClass: 'map' }); }
  else if (kind === 'j4wing') { const [c, s] = await J('j4'); placeOnBoard({ ui }, { title: s.wing.title, ...c.WING_BOARD }); }
  else if (kind === 'j5sort') { const [, s] = await J('j5'); sortCards({ ui }, { title: s.sort.title, bins: s.sort.bins, cards: s.sort.cards }); }
  else if (kind === 'j6pulley') { const [c, s] = await J('j6'); chooseCards({ ui }, { title: s.pulley.title, prompt: s.pulley.prompt, figure: c.pulleySVG(), cards: s.pulley.cards }); }
  // 탐험 화면 위 정보(HUD)와 대화창을 가장 긴 글로 한꺼번에 띄운다(세로·가로 화면 배치 검사)
  else if (kind === 'hud') {
    const { createHud } = await import('../core/screens.js');
    const { createDialogue } = await import('../core/dialogue.js');
    const hud = createHud(ui, { touch: true });
    hud.show({ no: 3, years: '1894', event: '농민들이 일어서다' }, { name: '고부의 젊은 농민' });
    hud.setGoal('행상 아주머니에게 말을 걸어 피란민 마을 소식을 들어 보자', [2, 6]);
    hud.setFound('살펴본 안내판 1 / 3'); hud.setCounter('모은 대원 2 / 5');
    hud.setTimer(42); hud.setWait('손님이 내리는 중 3초');
    // 새 장소 알림은 탐험 중, 놀이 알림은 미니게임 중에 뜬다(둘이 한꺼번에 뜨지 않는다)
    if (!new URLSearchParams(location.search).get('toast')) hud.notice('새 장소 발견: 우리말 큰사전 원고를 모으던 조선어 학회');
    else { const { toast } = await import('../chapters/kit/play.js'); toast({ ui }, '농민이 함께해요! 마을 사람 다섯 명이 농민군에 모였어요', 'good'); }
    const d = createDialogue(ui, { a: { name: '대한민국 임시 정부 국무령 김구', look: { robe: 0x2b2b2b } } }, { typeMs: 0 });
    d.say({ who: 'a', text: '우리는 나라를 되찾을 때까지 결코 포기하지 않을 것이오. 상하이의 작은 골목에서도 독립의 꿈은 자라고 있다네. 자, 이 편지를 들고 헌병의 눈을 피해 골목 끝 청사까지 조심히 가 주게나.' });
  }
  else if (kind === 'title') {
    const { showTitle } = await import('../core/screens.js');
    const { COURSES } = await import('../chapters/index.js');
    const save = { data: { chapters: { ch1: { stars: 3 } } }, chapterResult: id => (id === 'ch1' ? { stars: 3 } : null) };
    showTitle(ui, { savedName: '5학년 3반 12번', hasProgress: true, storageOk: true, courses: COURSES, save, course: 'goryeo' });
  }
  // 근대~현대편 카드형 미니게임: kind=kit:h3:0 (장 id: 부분 번호), &fill=1 이면 자리 놓기를 마지막 하나만 남기고 채운다
  else if (kind.startsWith('kit:')) {
    const [, id, n] = kind.split(':');
    const dir = { k: 'modern', i: 'colonial', h: 'present' }[id[0]];
    const p = Object.values((await import(`../chapters/${dir}/${id}/script.js`)).default.parts)[+n];
    const updates = new Set(); (function loop() { for (const f of updates) f(1 / 60); requestAnimationFrame(loop); })();
    const ctx = { ui, testHooks: {}, onAction: () => () => {}, world: { onUpdate: f => { updates.add(f); return () => updates.delete(f); } } };
    if (p.type === 'choose') chooseCards(ctx, { title: p.title, prompt: p.prompt, cards: p.cards, figure: p.figure });
    if (p.type === 'sort') sortCards(ctx, { title: p.title, bins: p.bins, cards: p.cards });
    if (p.type === 'order') orderCards(ctx, { title: p.title, cards: p.cards });
    if (p.type === 'gauge') timingBar(ctx, { title: p.title, prompt: p.prompt, label: p.label, zone: p.zone, seconds: 1000 });
    if (p.type === 'place') {
      placeOnBoard(ctx, { title: p.title, items: p.items, slots: p.slots, decor: p.decor, boardClass: p.boardClass });
      if (new URLSearchParams(location.search).has('fill')) for (const it of p.items.slice(0, -1)) ui.querySelector(`.place-slot[data-slot="${p.slots.find(s => s.answer === it.id).id}"]`).click();
    }
  }
  else orderCards({ ui }, { title: '고려를 지킨 사람들: 일어난 순서대로 눌러요', cards: ['서희의 담판 (993)', '양규의 흥화진 방어 (1010)', '강감찬의 귀주 대첩 (1019)', '강화도 천도 (1232년 7월)', '김윤후의 처인성 싸움 (1232년 12월)', '팔만대장경 만들기 (1236~1251)', '삼별초의 항쟁 (1270~1273)'] });
  document.documentElement.dataset.ready = '1';
</script>
</html>
